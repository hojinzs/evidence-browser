name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # Version Packages PR 생성 및 GitHub Release 태그
      pull-requests: write  # "Version Packages" PR 열기
      packages: write       # ghcr.io push
      id-token: write       # npm Trusted Publisher (OIDC)
      actions: write        # Docker workflow_dispatch 트리거

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Build CLI
        run: npm run build:cli

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run changeset:version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 앱(api/web/shared)은 private 이라 npm publish 가 없다.
      # Version Packages PR 이 머지돼 앱 버전이 올라간 순간을 태그 유무로 판별한다.
      # hasChangesets == 'true' 이면 이번 push 는 "Version Packages" PR 을 연 것뿐이므로
      # 아직 릴리즈가 아니다. 그 PR 이 머지된 다음 push 에서만 태그를 만든다.
      - name: Tag app release
        id: app
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' packages/api/package.json)
          if git rev-parse -q --verify "refs/tags/app-v${VERSION}" >/dev/null; then
            echo "app-v${VERSION} 태그가 이미 존재 → 앱 릴리즈 없음"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "app-v${VERSION}"
          git push origin "app-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 으로 push 한 태그는 다른 워크플로를 트리거하지 않으므로 직접 dispatch 한다.
      - name: Trigger Docker release
        if: steps.app.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml --ref main -f version="app-v${{ steps.app.outputs.version }}"
