name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: test-secret
      STORAGE_LOCAL_PATH: ./data/bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: shared
            workspace: "@evidence-browser/shared"
          - package: api
            workspace: "@evidence-browser/api"
          - package: web
            workspace: "@evidence-browser/web"
          - package: cli
            workspace: evidence-browser-cli
    env:
      AUTH_SECRET: test-secret
      STORAGE_LOCAL_PATH: ./data/bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w ${{ matrix.workspace }} run test

  coverage:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: test-secret
      STORAGE_LOCAL_PATH: ./data/bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: test-secret
      STORAGE_LOCAL_PATH: ./data/bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: test-secret
      AUTH_BYPASS: "true"
      STORAGE_LOCAL_PATH: ./data/bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
