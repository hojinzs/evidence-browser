name: Docker

on:
  push:
    branches: [main]
    tags:
      - "app-v*"   # 앱 릴리즈 (release.yml 이 생성)
      - "v*"       # 레거시 태그 (0.1.3 이하, CLI 버전 기반)
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag to build, e.g. app-v0.2.0 (비우면 현재 ref 를 빌드)"
        required: false
        type: string

concurrency:
  group: docker-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      # app-v0.2.0 / v0.2.0 → RELEASE_VERSION=v0.2.0 (릴리즈 빌드)
      # main 브랜치 push → RELEASE_VERSION 비어 있음 (연속 배포)
      - name: Resolve release version
        run: |
          set -euo pipefail
          REF="${{ inputs.version || github.ref_name }}"
          case "${REF}" in
            app-v*|v*) echo "RELEASE_VERSION=${REF#app-}" >> "$GITHUB_ENV" ;;
            *)         echo "RELEASE_VERSION=" >> "$GITHUB_ENV" ;;
          esac

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # main push → :main, :sha-abc1234 (연속 배포, latest 는 건드리지 않음)
            type=raw,value=main,enable=${{ env.RELEASE_VERSION == '' }}
            type=sha,enable=${{ env.RELEASE_VERSION == '' }}
            # v* 태그 / dispatch → :1.2.3, :1.2, :1, :latest
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
